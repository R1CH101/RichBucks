# Production / Coolify stack — 4 QBFT validators + filtered public RPC
# Prerequisites: ./scripts/init-network.sh prod  (generates ./network/)
# Validators are NOT published on the host (internal Docker network only).
# Public MetaMask/RPC traffic goes through rpc-filter (ETH/NET/WEB3 allowlist).

x-besu-common: &besu-common
  image: hyperledger/besu:${BESU_VERSION:-25.1.0}
  restart: unless-stopped
  networks:
    - richbucks
  environment:
    JAVA_OPTS: ${BESU_JAVA_OPTS:--Xmx1g}
  volumes:
    - ./network/genesis.json:/config/genesis.json:ro

services:
  validator-1:
    <<: *besu-common
    container_name: rb-validator-1
    command:
      - --data-path=/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/data/key
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      # ETH/NET/WEB3 only — no QBFT consensus RPC reachable from bot/admin
      - --rpc-http-api=ETH,NET,WEB3
      - --rpc-http-cors-origins=none
      - --host-allowlist=validator-1,rpc-filter,bot,admin,localhost,127.0.0.1
      - --rpc-ws-enabled=false
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - ./network/genesis.json:/config/genesis.json:ro
      - ./network/validator-1/data:/data
    expose:
      - "8545"
      - "30303"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' http://127.0.0.1:8545 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  validator-2:
    <<: *besu-common
    container_name: rb-validator-2
    depends_on:
      validator-1:
        condition: service_healthy
    command:
      - --data-path=/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/data/key
      - --min-gas-price=0
      - --bootnodes=${BOOTNODE_ENODE}
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --host-allowlist=validator-2,localhost,127.0.0.1
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - ./network/genesis.json:/config/genesis.json:ro
      - ./network/validator-2/data:/data
    expose:
      - "8545"

  validator-3:
    <<: *besu-common
    container_name: rb-validator-3
    depends_on:
      validator-1:
        condition: service_healthy
    command:
      - --data-path=/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/data/key
      - --min-gas-price=0
      - --bootnodes=${BOOTNODE_ENODE}
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --host-allowlist=validator-3,localhost,127.0.0.1
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - ./network/genesis.json:/config/genesis.json:ro
      - ./network/validator-3/data:/data
    expose:
      - "8545"

  validator-4:
    <<: *besu-common
    container_name: rb-validator-4
    depends_on:
      validator-1:
        condition: service_healthy
    command:
      - --data-path=/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/data/key
      - --min-gas-price=0
      - --bootnodes=${BOOTNODE_ENODE}
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --host-allowlist=validator-4,localhost,127.0.0.1
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - ./network/genesis.json:/config/genesis.json:ro
      - ./network/validator-4/data:/data
    expose:
      - "8545"

  # Public wallet RPC — method allowlist (no QBFT/admin)
  rpc-filter:
    build: ./rpc-filter
    image: ghcr.io/${GHCR_OWNER:-richbucks}/rpc-filter:${TAG:-latest}
    container_name: rb-rpc-filter
    restart: unless-stopped
    depends_on:
      validator-1:
        condition: service_healthy
    environment:
      PORT: 8549
      UPSTREAM_RPC: http://validator-1:8545
      RPC_API_KEY: ${RPC_API_KEY:-}
      RPC_REQUIRE_API_KEY: ${RPC_REQUIRE_API_KEY:-true}
      RPC_RATE_MAX: ${RPC_RATE_MAX:-120}
    ports:
      - "8549:8549"
    networks:
      - richbucks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8549/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  richbucks:
    name: richbucks
