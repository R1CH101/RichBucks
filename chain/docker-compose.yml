# Chain-only compose (local / advanced). Coolify uses the root ../docker-compose.yml
# which inlines these services — Compose `include:` is unreliable there.
#
# Persistent volume: chain-network (genesis + keys + Besu data)
# chain-init writes on first boot. Validators are NOT host-published.

x-besu-common: &besu-common
  image: hyperledger/besu:${BESU_IMAGE_TAG:-25.1.0}
  restart: unless-stopped
  networks:
    - richbucks
  environment:
    JAVA_OPTS: ${BESU_JAVA_OPTS:--Xmx1g}
  # Strip Coolify BESU_VERSION; fill empty --bootnodes= from volume/key.pub.
  entrypoint:
    - /bin/bash
    - -c
    - >-
      n=$$(printf '\x42\x45\x53\x55\x5f\x56\x45\x52\x53\x49\x4f\x4e');
      unset "$$n" 2>/dev/null || true;
      resolve_boot() {
        if [[ -f /network/bootnode.enode ]]; then
          tr -d '[:space:]' </network/bootnode.enode;
          return 0;
        fi;
        if [[ -f /network/validator-1/data/key.pub ]]; then
          pub=$$(tr -d '[:space:]' </network/validator-1/data/key.pub);
          pub=$${pub#0x};
          if [[ $${#pub} -eq 130 && $${pub:0:2} == 04 ]]; then pub=$${pub:2}; fi;
          if [[ $${#pub} -eq 128 ]]; then echo "enode://$${pub}@validator-1:30303"; return 0; fi;
        fi;
        return 1;
      };
      args=();
      for a in "$$@"; do
        case "$$a" in
          --bootnodes=)
            if b=$$(resolve_boot); then args+=("--bootnodes=$$b"); fi;
            ;;
          --bootnodes=*)
            val="$${a#--bootnodes=}";
            if [[ -z "$$val" ]]; then
              if b=$$(resolve_boot); then args+=("--bootnodes=$$b"); fi;
            else
              args+=("$$a");
            fi;
            ;;
          *) args+=("$$a");;
        esac;
      done;
      exec /opt/besu/bin/besu-entry.sh "$${args[@]}"
    - besu

services:
  chain-init:
    build:
      context: .
      dockerfile: init/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-richbucks}/chain-init:${TAG:-latest}
    restart: "no"
    user: "0:0"
    # Final image is Temurin (not Besu), so Coolify cannot restore besu-entry.sh.
    # Do not set compose `command`.
    entrypoint: ["/chain-init-entrypoint.sh"]
    environment:
      PROFILE: ${CHAIN_INIT_PROFILE:-prod}
      NETWORK_DIR: /network
      DEPLOYER_ADDRESS: ${DEPLOYER_ADDRESS:-}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:-}
    volumes:
      - chain-network:/network
    networks:
      - richbucks

  validator-1:
    <<: *besu-common
    container_name: rb-validator-1
    depends_on:
      chain-init:
        condition: service_completed_successfully
    command:
      - --data-path=/network/validator-1/data
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/network/validator-1/data/key
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      # ETH/NET/WEB3 only — no QBFT consensus RPC reachable from bot/admin
      - --rpc-http-api=ETH,NET,WEB3
      - --rpc-http-cors-origins=none
      - --host-allowlist=validator-1,rpc-filter,bot,admin,localhost,127.0.0.1
      - --rpc-ws-enabled=false
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - chain-network:/network
    expose:
      - "8545"
      - "30303"
    healthcheck:
      # Besu image has no curl/wget — bash /dev/tcp is enough to prove RPC is listening
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8545'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  validator-2:
    <<: *besu-common
    container_name: rb-validator-2
    depends_on:
      chain-init:
        condition: service_completed_successfully
      validator-1:
        condition: service_healthy
    command:
      - --data-path=/network/validator-2/data
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/network/validator-2/data/key
      - --min-gas-price=0
      - --bootnodes=${BOOTNODE_ENODE}
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --host-allowlist=validator-2,localhost,127.0.0.1
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - chain-network:/network
    expose:
      - "8545"

  validator-3:
    <<: *besu-common
    container_name: rb-validator-3
    depends_on:
      chain-init:
        condition: service_completed_successfully
      validator-1:
        condition: service_healthy
    command:
      - --data-path=/network/validator-3/data
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/network/validator-3/data/key
      - --min-gas-price=0
      - --bootnodes=${BOOTNODE_ENODE}
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --host-allowlist=validator-3,localhost,127.0.0.1
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - chain-network:/network
    expose:
      - "8545"

  validator-4:
    <<: *besu-common
    container_name: rb-validator-4
    depends_on:
      chain-init:
        condition: service_completed_successfully
      validator-1:
        condition: service_healthy
    command:
      - --data-path=/network/validator-4/data
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/network/validator-4/data/key
      - --min-gas-price=0
      - --bootnodes=${BOOTNODE_ENODE}
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --host-allowlist=validator-4,localhost,127.0.0.1
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - chain-network:/network
    expose:
      - "8545"

volumes:
  chain-network:
    name: ${COMPOSE_PROJECT_NAME:-richbucks}_chain-network

networks:
  richbucks:
    name: richbucks
