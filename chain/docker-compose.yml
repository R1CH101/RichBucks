# Production / Coolify stack — 4 QBFT validators + filtered public RPC
#
# Persistent Docker volumes (survive Coolify redeploys — no host bind mounts required):
#   chain-network  — genesis.json + validator keys + Besu chain data
#   (bot-wallets is declared in root docker-compose.yml)
#
# chain-init runs once in Docker and writes into chain-network if empty.
# Validators are NOT published on the host. Public RPC = rpc-filter:8549.

x-besu-common: &besu-common
  image: hyperledger/besu:${BESU_VERSION:-25.1.0}
  restart: unless-stopped
  networks:
    - richbucks
  environment:
    JAVA_OPTS: ${BESU_JAVA_OPTS:--Xmx1g}

services:
  chain-init:
    build:
      context: .
      dockerfile: init/Dockerfile
      args:
        BESU_VERSION: ${BESU_VERSION:-25.1.0}
    image: ghcr.io/${GHCR_OWNER:-richbucks}/chain-init:${TAG:-latest}
    container_name: rb-chain-init
    restart: "no"
    environment:
      PROFILE: ${CHAIN_INIT_PROFILE:-prod}
      DEPLOYER_ADDRESS: ${DEPLOYER_ADDRESS:-}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:-}
    volumes:
      - chain-network:/network
    networks:
      - richbucks

  validator-1:
    <<: *besu-common
    container_name: rb-validator-1
    depends_on:
      chain-init:
        condition: service_completed_successfully
    command:
      - --data-path=/network/validator-1/data
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/network/validator-1/data/key
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      # ETH/NET/WEB3 only — no QBFT consensus RPC reachable from bot/admin
      - --rpc-http-api=ETH,NET,WEB3
      - --rpc-http-cors-origins=none
      - --host-allowlist=validator-1,rpc-filter,bot,admin,localhost,127.0.0.1
      - --rpc-ws-enabled=false
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - chain-network:/network
    expose:
      - "8545"
      - "30303"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' http://127.0.0.1:8545 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  validator-2:
    <<: *besu-common
    container_name: rb-validator-2
    depends_on:
      chain-init:
        condition: service_completed_successfully
      validator-1:
        condition: service_healthy
    command:
      - --data-path=/network/validator-2/data
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/network/validator-2/data/key
      - --min-gas-price=0
      - --bootnodes=${BOOTNODE_ENODE}
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --host-allowlist=validator-2,localhost,127.0.0.1
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - chain-network:/network
    expose:
      - "8545"

  validator-3:
    <<: *besu-common
    container_name: rb-validator-3
    depends_on:
      chain-init:
        condition: service_completed_successfully
      validator-1:
        condition: service_healthy
    command:
      - --data-path=/network/validator-3/data
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/network/validator-3/data/key
      - --min-gas-price=0
      - --bootnodes=${BOOTNODE_ENODE}
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --host-allowlist=validator-3,localhost,127.0.0.1
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - chain-network:/network
    expose:
      - "8545"

  validator-4:
    <<: *besu-common
    container_name: rb-validator-4
    depends_on:
      chain-init:
        condition: service_completed_successfully
      validator-1:
        condition: service_healthy
    command:
      - --data-path=/network/validator-4/data
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/network/validator-4/data/key
      - --min-gas-price=0
      - --bootnodes=${BOOTNODE_ENODE}
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --host-allowlist=validator-4,localhost,127.0.0.1
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - chain-network:/network
    expose:
      - "8545"

  # Public wallet RPC — method allowlist (no QBFT/admin)
  rpc-filter:
    build: ./rpc-filter
    image: ghcr.io/${GHCR_OWNER:-richbucks}/rpc-filter:${TAG:-latest}
    container_name: rb-rpc-filter
    restart: unless-stopped
    depends_on:
      validator-1:
        condition: service_healthy
    environment:
      PORT: 8549
      UPSTREAM_RPC: http://validator-1:8545
      RPC_API_KEY: ${RPC_API_KEY:-}
      RPC_REQUIRE_API_KEY: ${RPC_REQUIRE_API_KEY:-true}
      RPC_RATE_MAX: ${RPC_RATE_MAX:-120}
    ports:
      - "8549:8549"
    networks:
      - richbucks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8549/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  chain-network:
    name: ${COMPOSE_PROJECT_NAME:-richbucks}_chain-network

networks:
  richbucks:
    name: richbucks
