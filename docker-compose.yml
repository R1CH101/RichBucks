# Coolify / VPS all-in-one stack
# 1) cd chain && ./scripts/init-network.sh prod
# 2) Set BOOTNODE_ENODE after validator-1 first start (see guide.md)
# 3) Deploy with real secrets (NODE_ENV=production fails closed if placeholders remain)
#
# Validators are not host-published. Public RPC = rpc-filter:8549 (ETH/NET/WEB3 only).
# Bot/admin: expose only on Docker network — point Coolify proxy at service:port.

include:
  - path: chain/docker-compose.yml

services:
  bot:
    build: ./bot
    image: ghcr.io/${GHCR_OWNER:-richbucks}/bot:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      RICHBUCKS_REQUIRE_SECRETS: "true"
      RPC_URL: http://validator-1:8545
      WALLET_DB_PATH: /data/wallets.sqlite
      BOT_PORT: 3978
      # Never inject contract owner into the bot (overrides env_file)
      DEPLOYER_PRIVATE_KEY: ""
      ADMIN_PASSWORD: ""
      ADMIN_PASSWORD_HASH: ""
      ADMIN_TOTP_SECRET: ""
      SESSION_SECRET: ""
    volumes:
      - bot-wallets:/data
    expose:
      - "3978"
    depends_on:
      validator-1:
        condition: service_healthy
    networks:
      - richbucks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3978/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8

  admin:
    build: ./admin
    image: ghcr.io/${GHCR_OWNER:-richbucks}/admin:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      RICHBUCKS_REQUIRE_SECRETS: "true"
      COOKIE_SECURE: "true"
      RPC_URL: http://validator-1:8545
      ADMIN_PORT: 3000
      GENESIS_PATH: /config/genesis.json
    volumes:
      - ./chain/network/genesis.json:/config/genesis.json:ro
    expose:
      - "3000"
    depends_on:
      validator-1:
        condition: service_healthy
    networks:
      - richbucks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  bot-wallets:
