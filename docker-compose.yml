# Coolify / VPS all-in-one stack (single file — Coolify does not reliably merge Compose `include:`)
#
# Persistent volumes:
#   chain-network  — genesis, keys, chain data, bootnode.enode, contract.address (chain-init + contract-deploy)
#   bot-wallets    — custodial Teams wallet SQLite
#   app-config     — encrypted multi Teams-app registry
#
# Domains (expose, not host ports):
#   bot        → https://bot.richbucks.xyz:3978
#   admin      → https://admin.richbucks.xyz:3000
#   rpc-filter → https://rpc.richbucks.xyz:8549

x-besu-common: &besu-common
  # Custom image: Coolify restores image ENTRYPOINT; stock Besu ignores our compose wrapper
  # and rejects DNS names in static-nodes. This image resolves validator-1 → IPv4 on boot.
  build:
    context: ./chain/besu-node
    dockerfile: Dockerfile
    args:
      BESU_IMAGE_TAG: ${BESU_IMAGE_TAG:-25.1.0}
  image: ghcr.io/${GHCR_OWNER:-richbucks}/besu-node:${TAG:-latest}
  restart: unless-stopped
  networks:
    - richbucks
  environment:
    JAVA_OPTS: ${BESU_JAVA_OPTS:--Xmx1g}
    BOOTNODE_HOST: validator-1
    BOOTNODE_PORT: "30303"

services:
  chain-init:
    build:
      context: ./chain
      dockerfile: init/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-richbucks}/chain-init:${TAG:-latest}
    restart: "no"
    user: "0:0"
    # Final image is Temurin (not Besu), so Coolify cannot restore besu-entry.sh.
    # Do not set compose `command`.
    entrypoint: ["/chain-init-entrypoint.sh"]
    environment:
      PROFILE: ${CHAIN_INIT_PROFILE:-prod}
      NETWORK_DIR: /network
      DEPLOYER_ADDRESS: ${DEPLOYER_ADDRESS:-}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:-}
    volumes:
      - chain-network:/network
    networks:
      - richbucks

  validator-1:
    <<: *besu-common
    container_name: rb-validator-1
    depends_on:
      chain-init:
        condition: service_completed_successfully
    command:
      - --data-path=/network/validator-1/data
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/network/validator-1/data/key
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --rpc-http-cors-origins=none
      - --host-allowlist=validator-1,rpc-filter,bot,admin,localhost,127.0.0.1
      - --rpc-ws-enabled=false
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - chain-network:/network
    expose:
      - "8545"
      - "30303"
    healthcheck:
      # Besu image has no curl/wget — bash /dev/tcp is enough to prove RPC is listening
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8545'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  validator-2:
    <<: *besu-common
    container_name: rb-validator-2
    depends_on:
      chain-init:
        condition: service_completed_successfully
      validator-1:
        condition: service_healthy
    command:
      - --data-path=/network/validator-2/data
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/network/validator-2/data/key
      - --min-gas-price=0
      # Peers come from /network/validator-N/data/static-nodes.json (written by chain-init).
      # Coolify restores Besu ENTRYPOINT and ignores compose bootnode wrappers / empty BOOTNODE_ENODE.
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --host-allowlist=validator-2,localhost,127.0.0.1
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - chain-network:/network
    expose:
      - "8545"

  validator-3:
    <<: *besu-common
    container_name: rb-validator-3
    depends_on:
      chain-init:
        condition: service_completed_successfully
      validator-1:
        condition: service_healthy
    command:
      - --data-path=/network/validator-3/data
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/network/validator-3/data/key
      - --min-gas-price=0
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --host-allowlist=validator-3,localhost,127.0.0.1
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - chain-network:/network
    expose:
      - "8545"

  validator-4:
    <<: *besu-common
    container_name: rb-validator-4
    depends_on:
      chain-init:
        condition: service_completed_successfully
      validator-1:
        condition: service_healthy
    command:
      - --data-path=/network/validator-4/data
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/network/validator-4/data/key
      - --min-gas-price=0
      - --p2p-port=30303
      - --p2p-host=0.0.0.0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3
      - --host-allowlist=validator-4,localhost,127.0.0.1
      - --nat-method=NONE
      - --profile=ENTERPRISE
    volumes:
      - chain-network:/network
    expose:
      - "8545"

  rpc-filter:
    build: ./chain/rpc-filter
    image: ghcr.io/${GHCR_OWNER:-richbucks}/rpc-filter:${TAG:-latest}
    container_name: rb-rpc-filter
    restart: unless-stopped
    environment:
      PORT: 8549
      UPSTREAM_RPC: http://validator-1:8545
      RPC_API_KEY: ${RPC_API_KEY:-}
      RPC_REQUIRE_API_KEY: ${RPC_REQUIRE_API_KEY:-false}
      RPC_RATE_MAX: ${RPC_RATE_MAX:-120}
      SERVICE_URL_RPC_FILTER_8549: ${SERVICE_URL_RPC_FILTER_8549:-}
    expose:
      - "8549"
    depends_on:
      validator-1:
        condition: service_healthy
    networks:
      - richbucks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8549/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # After RPC is up: deploy RB proxy (idempotent). Writes /network/contract.address.
  # Not part of chain-init — that job has no live chain yet.
  contract-deploy:
    build: ./contracts
    image: ghcr.io/${GHCR_OWNER:-richbucks}/contract-deploy:${TAG:-latest}
    container_name: rb-contract-deploy
    restart: "no"
    environment:
      NETWORK_DIR: /network
      RPC_URL: http://validator-1:8545
      CHAIN_ID: ${CHAIN_ID:-88420}
      DEPLOYER_PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:-}
      WELCOME_MINTER_PRIVATE_KEY: ${WELCOME_MINTER_PRIVATE_KEY:-}
      WELCOME_MINTER_ADDRESS: ${WELCOME_MINTER_ADDRESS:-}
    volumes:
      - chain-network:/network
    depends_on:
      validator-1:
        condition: service_healthy
    networks:
      - richbucks

  bot:
    build: ./bot
    image: ghcr.io/${GHCR_OWNER:-richbucks}/bot:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      RICHBUCKS_REQUIRE_SECRETS: "true"
      RPC_URL: http://validator-1:8545
      WALLET_DB_PATH: /data/wallets.sqlite
      TEAMS_CONFIG_DIR: /config
      BOT_PORT: 3978
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      DEPLOYER_PRIVATE_KEY: ""
      ADMIN_PASSWORD: ""
      ADMIN_PASSWORD_HASH: ""
      ADMIN_TOTP_SECRET: ""
      SESSION_SECRET: ""
    volumes:
      - bot-wallets:/data
      - app-config:/config
      - chain-network:/network:ro
    expose:
      - "3978"
    depends_on:
      validator-1:
        condition: service_healthy
      contract-deploy:
        condition: service_completed_successfully
    networks:
      - richbucks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3978/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8

  admin:
    build: ./admin
    image: ghcr.io/${GHCR_OWNER:-richbucks}/admin:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      RICHBUCKS_REQUIRE_SECRETS: "true"
      COOKIE_SECURE: "true"
      RPC_URL: http://validator-1:8545
      ADMIN_PORT: 3000
      GENESIS_PATH: /network/genesis.json
      TEAMS_CONFIG_DIR: /config
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      WALLET_DB_PATH: /data/wallets.sqlite
    volumes:
      - chain-network:/network:ro
      - app-config:/config
      - bot-wallets:/data:ro
    expose:
      - "3000"
    depends_on:
      chain-init:
        condition: service_completed_successfully
      validator-1:
        condition: service_healthy
      contract-deploy:
        condition: service_completed_successfully
    networks:
      - richbucks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  bot-wallets:
    name: ${COMPOSE_PROJECT_NAME:-richbucks}_bot-wallets
  app-config:
    name: ${COMPOSE_PROJECT_NAME:-richbucks}_app-config
  chain-network:
    name: ${COMPOSE_PROJECT_NAME:-richbucks}_chain-network

networks:
  richbucks:
    name: richbucks
