# Coolify / VPS all-in-one stack
#
# Persistent volumes (Docker-managed — map these in Coolify if it asks; do not use ephemeral /data only):
#   chain-network  — genesis, validator keys, blockchain (created by chain-init in Docker)
#   bot-wallets    — custodial Teams wallet SQLite
#   app-config     — encrypted multi Teams-app registry (admin + bot)
#
# 1) Set env (include DEPLOYER_ADDRESS or TREASURY_ADDRESS so genesis prefills the owner)
# 2) Deploy — chain-init runs automatically once; later redeploys reuse the volume
# 3) Set BOOTNODE_ENODE after validator-1 first start (see guide.md)
#
# Validators are not host-published. Public RPC = rpc-filter (ETH/NET/WEB3 only).
# Coolify domains: define services in THIS file (include: services often omit from UI).
#   bot   → https://bot.richbucks.xyz:3978
#   admin → https://admin.richbucks.xyz:3000
#   rpc-filter → https://rpc.richbucks.xyz:8549
# Use expose (not host ports:) so Coolify proxy can attach domains.

include:
  - path: chain/docker-compose.yml

services:
  # Public JSON-RPC gateway — must live in root compose for Coolify domain picker
  rpc-filter:
    build: ./chain/rpc-filter
    image: ghcr.io/${GHCR_OWNER:-richbucks}/rpc-filter:${TAG:-latest}
    container_name: rb-rpc-filter
    restart: unless-stopped
    environment:
      PORT: 8549
      UPSTREAM_RPC: http://validator-1:8545
      RPC_API_KEY: ${RPC_API_KEY:-}
      RPC_REQUIRE_API_KEY: ${RPC_REQUIRE_API_KEY:-true}
      RPC_RATE_MAX: ${RPC_RATE_MAX:-120}
      # Helps Coolify associate a generated URL with this component + port
      SERVICE_URL_RPC_FILTER_8549: ${SERVICE_URL_RPC_FILTER_8549:-}
    expose:
      - "8549"
    depends_on:
      validator-1:
        condition: service_healthy
    networks:
      - richbucks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8549/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  bot:
    build: ./bot
    image: ghcr.io/${GHCR_OWNER:-richbucks}/bot:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      RICHBUCKS_REQUIRE_SECRETS: "true"
      RPC_URL: http://validator-1:8545
      WALLET_DB_PATH: /data/wallets.sqlite
      TEAMS_CONFIG_DIR: /config
      BOT_PORT: 3978
      # Never inject contract owner into the bot (overrides env_file)
      DEPLOYER_PRIVATE_KEY: ""
      ADMIN_PASSWORD: ""
      ADMIN_PASSWORD_HASH: ""
      ADMIN_TOTP_SECRET: ""
      SESSION_SECRET: ""
    volumes:
      - bot-wallets:/data
      - app-config:/config
    expose:
      - "3978"
    depends_on:
      validator-1:
        condition: service_healthy
    networks:
      - richbucks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3978/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8

  admin:
    build: ./admin
    image: ghcr.io/${GHCR_OWNER:-richbucks}/admin:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      RICHBUCKS_REQUIRE_SECRETS: "true"
      COOKIE_SECURE: "true"
      RPC_URL: http://validator-1:8545
      ADMIN_PORT: 3000
      GENESIS_PATH: /network/genesis.json
      TEAMS_CONFIG_DIR: /config
    volumes:
      - chain-network:/network:ro
      - app-config:/config
    expose:
      - "3000"
    depends_on:
      chain-init:
        condition: service_completed_successfully
      validator-1:
        condition: service_healthy
    networks:
      - richbucks
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  bot-wallets:
    name: ${COMPOSE_PROJECT_NAME:-richbucks}_bot-wallets
  app-config:
    name: ${COMPOSE_PROJECT_NAME:-richbucks}_app-config
  # Re-declare so Coolify/root merge sees it (defined in chain/docker-compose.yml too)
  chain-network:
    name: ${COMPOSE_PROJECT_NAME:-richbucks}_chain-network

# Declared here too — Coolify's compose merge doesn't always inherit
# networks from `include:` (chain/docker-compose.yml)
networks:
  richbucks:
    name: richbucks
