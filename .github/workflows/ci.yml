name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  contracts:
    name: Contracts
    runs-on: ubicloud-standard-4
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test
      # Informational only — Hardhat toolchain carries known transitive CVEs
      - name: npm audit (contracts, informational)
        continue-on-error: true
        run: npm audit --audit-level=high

  bot-build:
    name: Bot build
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  admin-build:
    name: Admin build
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  images:
    name: Publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contracts, bot-build, admin-build]
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$OWNER_LC/bot:$TAG -t ghcr.io/$OWNER_LC/bot:latest ./bot
          docker build -t ghcr.io/$OWNER_LC/admin:$TAG -t ghcr.io/$OWNER_LC/admin:latest ./admin
          docker build -t ghcr.io/$OWNER_LC/coworker-node:$TAG -t ghcr.io/$OWNER_LC/coworker-node:latest ./chain/coworker
          docker build -t ghcr.io/$OWNER_LC/rpc-filter:$TAG -t ghcr.io/$OWNER_LC/rpc-filter:latest ./chain/rpc-filter
          docker build -t ghcr.io/$OWNER_LC/chain-init:$TAG -t ghcr.io/$OWNER_LC/chain-init:latest -f ./chain/init/Dockerfile ./chain
          docker build -t ghcr.io/$OWNER_LC/contract-deploy:$TAG -t ghcr.io/$OWNER_LC/contract-deploy:latest ./contracts
          docker build -t ghcr.io/$OWNER_LC/besu-node:$TAG -t ghcr.io/$OWNER_LC/besu-node:latest ./chain/besu-node
          docker push ghcr.io/$OWNER_LC/bot:$TAG
          docker push ghcr.io/$OWNER_LC/bot:latest
          docker push ghcr.io/$OWNER_LC/admin:$TAG
          docker push ghcr.io/$OWNER_LC/admin:latest
          docker push ghcr.io/$OWNER_LC/coworker-node:$TAG
          docker push ghcr.io/$OWNER_LC/coworker-node:latest
          docker push ghcr.io/$OWNER_LC/rpc-filter:$TAG
          docker push ghcr.io/$OWNER_LC/rpc-filter:latest
          docker push ghcr.io/$OWNER_LC/chain-init:$TAG
          docker push ghcr.io/$OWNER_LC/chain-init:latest
          docker push ghcr.io/$OWNER_LC/contract-deploy:$TAG
          docker push ghcr.io/$OWNER_LC/contract-deploy:latest
          docker push ghcr.io/$OWNER_LC/besu-node:$TAG
          docker push ghcr.io/$OWNER_LC/besu-node:latest
